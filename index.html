<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Advents Adventure</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: #0f172a; color: #f8fafc; overflow: hidden; touch-action: none; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* Start Screen / Charakter-Editor */
        #login-screen {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
        }
        .card { background: #1e293b; border: 3px solid #38bdf8; border-radius: 12px; padding: 25px; max-width: 400px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 2px solid #64748b; color: white; border-radius: 6px; font-size: 16px; }
        button { background: #10b981; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #059669; }

        /* HUD / Status Bar */
        #hud {
            height: 60px; background: #1e293b; border-bottom: 2px solid #334155;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 14px; z-index: 10;
        }
        .hud-item { display: flex; align-items: center; gap: 8px; }
        .aura-badge { color: #facc15; font-weight: bold; }

        /* Game Canvas Container */
        #canvas-container { flex: 1; position: relative; background: #0b1329; overflow: hidden; }
        canvas { display: block; background: linear-gradient(to bottom, #1e293b, #0f172a); }

        /* Modal Overlays für Aufgaben & Minispiele */
        #modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 50;
            display: none; align-items: center; justify-content: center; padding: 15px;
        }
        .modal-content {
            background: #1e293b; border: 3px solid #f43f5e; border-radius: 12px;
            width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative;
        }
        .close-btn { position: absolute; top: 10px; right: 15px; background: #ef4444; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        /* Admin / Live-Beobachter Panel */
        #admin-panel {
            position: absolute; bottom: 10px; left: 10px; background: rgba(30, 41, 59, 0.9);
            border: 2px solid #facc15; padding: 10px; border-radius: 8px; font-size: 12px; z-index: 20; display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Startbildschirm & Charakter-Editor -->
        <div id="login-screen">
            <div class="card">
                <h2>❄️ Advents Adventure ❄️</h2>
                <p style="margin: 10px 0; font-size: 13px; color: #94a3b8;">Erstelle deinen Pixel-Charakter und betretet eure gemeinsame Welt!</p>
                <input type="text" id="player-name" placeholder="Dein Name..." value="Hasi">
                <label style="text-align: left; font-size: 12px; color: #94a3b8;">Rolle wählen:</label>
                <select id="player-role">
                    <option value="player">Spielerin (Das Abenteuer erleben)</option>
                    <option value="admin">Helfer / Admin (Zuschauen & Helfen)</option>
                </select>
                <label style="text-align: left; font-size: 12px; color: #94a3b8; margin-top: 10px;">Pullover-Farbe:</label>
                <input type="color" id="player-color" value="#f43f5e" style="height: 40px; padding: 0;">
                <button onclick="startGame()">Abenteuer starten 🎄</button>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" style="display: none;">
            <div class="hud-item">👤 <span id="hud-name">Hasi</span></div>
            <div class="hud-item">✨ Aura: <span id="hud-aura" class="aura-badge">0</span></div>
            <div class="hud-item">⏳ Timer: <span id="hud-timer">12:00:00</span></div>
            <div class="hud-item"><button onclick="openAdminPanel()" style="padding: 5px 10px; font-size: 12px; width: auto; margin:0;">Admin / Skip</button></div>
        </div>

        <!-- 2D Welt Canvas -->
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Minispiel / Quest Modal -->
        <div id="modal-overlay">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal()">×</button>
                <div id="modal-body"><!-- Dynamischer Inhalt der 25 Türchen & Minispiele --></div>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="admin-panel">
            <h4>Admin Live-Steuerung</h4>
            <p>Status: <span id="admin-status">Aktiv</span></p>
            <button onclick="skipCurrentTask()" style="background: #3b82f6; padding: 5px; font-size: 11px;">Aktive Aufgabe überspringen</button>
        </div>
    </div>

    <!-- Externe Skripte einbinden -->
    <script src="quests.js"></script>
    <script src="games.js"></script>
    <script>
        // Basis-Initialisierung & Steuerung der Welt
        let canvas, ctx;
        let gameState = { name: "Hasi", role: "player", color: "#f43f5e", aura: 0, x: 100, y: 100, activeQuest: null };

        function startGame() {
            gameState.name = document.getElementById('player-name').value || "Hasi";
            gameState.role = document.getElementById('player-role').value;
            gameState.color = document.getElementById('player-color').value;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            if(gameState.role === 'admin') document.getElementById('admin-panel').style.display = 'block';

            initCanvas();
        }

        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Touch / Keyboard Steuerung
            window.addEventListener('keydown', handleKeyInput);
            
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = document.getElementById('canvas-container').clientWidth;
            canvas.height = document.getElementById('canvas-container').clientHeight;
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Bewegungslogik der Welt
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Einfache Vorschau der Winterwelt (Hütte & interaktive Punkte)
            ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(50, 50, 200, 150); // Hütte
            ctx.fillStyle = gameState.color;
            ctx.fillRect(gameState.x, gameState.y, 24, 32); // Spieler-Figur

            ctx.fillStyle = "#ffffff";
            ctx.font = "12px Courier New";
            ctx.fillText(gameState.name, gameState.x - 10, gameState.y - 5);
        }

        function handleKeyInput(e) {
            const speed = 10;
            if(e.key === 'ArrowUp' || e.key === 'w') gameState.y -= speed;
            if(e.key === 'ArrowDown' || e.key === 's') gameState.y += speed;
            if(e.key === 'ArrowLeft' || e.key === 'a') gameState.x -= speed;
            if(e.key === 'ArrowRight' || e.key === 'd') gameState.x += speed;
        }

        function openModal(htmlContent) {
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function openAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function skipCurrentTask() {
            gameState.aura += 1;
            document.getElementById('hud-aura').innerText = gameState.aura;
            alert("Aufgabe vom Admin übersprungen! +1 Aura.");
            closeModal();
        }
    </script>
</body>
</html>
